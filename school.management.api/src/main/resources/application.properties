spring.application.name=school.management.api

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./schoolmanage
#spring.datasource.url=jdbc:h2:file:./schoolmanage;TRACE_LEVEL_FILE=4;TRACE_MAX_FILE_SIZE=10
spring.datasource.username=sa
spring.datasource.password=schoolmanage
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Schema generation strategy
spring.jpa.hibernate.ddl-auto=create-drop

# Port
server.port=4002

# Swagger Configuration
springdoc.swagger-ui.path=/swagger

# JPA Query Logging
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# JdbcTemplate Query Logging
#logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
#logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# QueryDSL Query Logging
#logging.level.com.querydsl.sql=DEBUG
#logging.level.com.querydsl.jpa=DEBUG
#logging.level.com.querydsl=DEBUG
#spring.jpa.show-sql=true

# Saving logs to file
logging.file.name=logs/school-management-api.log
spring.output.ansi.enabled=detect

# JWT token setup
jwt.secret=School management application by TechTrendz (Saka Shingirai Madzudzo)
jwt.expiration=60

# DevTools setup
spring.devtools.restart.exclude=reports/**,static/**,templates/**,schoolmanage.mv.db,schoolmanage.trace.db,report_parameter_examples.json,logs/**

# ===================================================================
# Spring Boot Actuator Configuration (for Docker health checks)
# ===================================================================
# Expose health and info endpoints
management.endpoints.web.exposure.include=health,info
# Enable health endpoint
management.endpoint.health.enabled=true
# Show health details
management.endpoint.health.show-details=always
# Base path for actuator endpoints
management.endpoints.web.base-path=/actuator